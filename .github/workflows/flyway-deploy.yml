name: Flyway Auto Deployment

on:
  push:
    branches:
      - Dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Server Info
        run: |
          echo "Server Name:"
          hostname

          echo "Current Directory:"
          pwd

          echo "Repository Contents:"
          ls -la

      - name: Verify Flyway
        run: |
          flyway -v

      - name: Execute Deployment
        run: |
          chmod +x deploy_all.sh
          ./deploy_all.sh